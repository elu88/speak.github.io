<!DOCTYPE html> 
  <html lang="am"> 
    <head> 
      <meta charset="UTF-8"> 
      <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
      <style> 
         body {
            font-family: 'Noto Sans Ethiopic', sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .navbar {
            width: 100%;
            background-color: rgb(218, 155, 67);
        }

        .navbar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .navbar a {
            display: block;
            color: white;
            text-align: center;
            padding: 15px;
            text-decoration: none;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: #333;
        }

        .navbar li {
            margin: 0 10px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            margin: 10px 0;
        }

        .header-container {
            background-color: #f69323;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            color: #fff;
            font-size: 2em;
            margin: 0;
        }

        p {
            font-size: 1em;
            line-height: 1.6;
            margin: 15px 0 0;
        }
      </style>
    </head>
    <body> 

      
    </body>
  </html>
